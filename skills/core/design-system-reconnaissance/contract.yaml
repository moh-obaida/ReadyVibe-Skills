name: design-system-reconnaissance
version: 0.1.0
contract: 1
kind: FOUNDATION
category: core
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Records tokens, components, and layout conventions already in the project. Use when you are about to create visible launch or admin UI. Do not use to invent a new visual style."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
