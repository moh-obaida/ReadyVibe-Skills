name: site-reconnaissance
version: 0.1.0
contract: 1
kind: FOUNDATION
category: core
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Inspects a web project and writes a .readyvibe reality model from files and an optional URL. Use when you need to know what a site actually does before changing it. Do not use to draft policies or apply fixes."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
