name: launch-verification
version: 0.1.0
contract: 1
kind: AUDITOR
category: core
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Re-runs checks after changes and computes the launch state from engine findings. Use when you need proof that a fix changed runtime or source behavior. Do not use as a legal sign-off."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
