name: compliance-diff
version: 0.1.0
contract: 1
kind: AUDITOR
category: core
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Compares two reality models and lists new vendors, data elements, and routes with their launch implications. Use when a pull request or before release. Do not use as a substitute for a full recon."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
