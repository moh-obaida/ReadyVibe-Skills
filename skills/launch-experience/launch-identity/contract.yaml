name: launch-identity
version: 0.1.0
contract: 1
kind: SPECIALIST
category: launch-experience
visual: VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Aligns the product name, titles, icons, and leftover starter branding. Use when a site still says Vite, Next, or Your Company Name. Do not invent a legal entity name. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
