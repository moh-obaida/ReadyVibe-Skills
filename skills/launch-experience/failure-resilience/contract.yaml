name: failure-resilience
version: 0.1.0
contract: 1
kind: SPECIALIST
category: launch-experience
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks empty, loading, and API-failure states. Use when the UI fetches data. Do not hide failures behind an infinite spinner. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
