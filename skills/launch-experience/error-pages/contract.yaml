name: error-pages
version: 0.1.0
contract: 1
kind: SPECIALIST
category: launch-experience
visual: VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks that unknown URLs return a real 404 and use the product's design. Use when launch. Do not accept a pretty page served with status 200. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
