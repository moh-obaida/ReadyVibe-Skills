name: dependency-security
version: 0.1.0
contract: 1
kind: SPECIALIST
category: security
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Reads the lockfile and known-vulnerability signals without running install scripts. Use when package manifests exist. Do not upgrade major versions automatically. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
