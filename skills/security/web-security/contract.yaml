name: web-security
version: 0.1.0
contract: 1
kind: SPECIALIST
category: security
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks secrets, sessions, and authorization clues against OWASP-style baseline controls. Use when preparing a public launch. Do not use a hidden admin link as authorization."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
