name: privacy-policy
version: 0.1.0
contract: 1
kind: SPECIALIST
category: compliance
visual: VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Drafts a privacy notice only from detected and owner-supplied facts, with placeholders for the rest. Use when a notice must match real behavior. Do not use a generic template or invent an address."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
