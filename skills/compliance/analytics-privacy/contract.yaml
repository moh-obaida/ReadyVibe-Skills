name: analytics-privacy
version: 0.1.0
contract: 1
kind: SPECIALIST
category: compliance
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks analytics, ads, and session replay for personal data and consent timing. Use when an analytics vendor is detected. Do not use to install a new analytics tool."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
