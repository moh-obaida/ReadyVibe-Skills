name: user-content-safety
version: 0.1.0
contract: 1
kind: SPECIALIST
category: compliance
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks reporting and moderation hooks for user-generated content. Use when users publish content others can see. Do not add a moderation queue to a site with no user content. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
