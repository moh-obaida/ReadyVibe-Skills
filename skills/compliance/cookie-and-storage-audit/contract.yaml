name: cookie-and-storage-audit
version: 0.1.0
contract: 1
kind: SPECIALIST
category: compliance
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Inventories cookies and other client storage and refuses to treat unknown items as essential. Use when you are about to add or remove a consent UI. Do not use to write the privacy policy."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
