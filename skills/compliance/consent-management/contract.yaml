name: consent-management
version: 0.1.0
contract: 1
kind: SPECIALIST
category: compliance
visual: VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Gates non-essential scripts behind a real choice and checks that rejection sticks. Use when analytics, ads, or replay are present, or a banner already exists. Do not use on a site with no non-essential storage."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
