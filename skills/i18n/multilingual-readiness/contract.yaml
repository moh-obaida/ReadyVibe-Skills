name: multilingual-readiness
version: 0.1.0
contract: 1
kind: SPECIALIST
category: i18n
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks locales, html lang, and whether trust pages exist in each language. Use when the site offers more than one language. Do not call it bilingual if the privacy page is not translated. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
