name: search-console-readiness
version: 0.1.0
contract: 1
kind: SPECIALIST
category: discoverability
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Prepares verification and sitemap steps an owner must authorize. Use when public URLs already exist. Do not use this to claim a page is indexed without Search Console data."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
