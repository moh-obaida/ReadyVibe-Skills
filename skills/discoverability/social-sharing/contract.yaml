name: social-sharing
version: 0.1.0
contract: 1
kind: SPECIALIST
category: discoverability
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks Open Graph and share images in the raw HTML. Use when preparing a public launch or campaign. Do not use localhost or a placeholder image."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
