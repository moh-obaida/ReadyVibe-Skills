name: seo-readiness
version: 0.1.0
contract: 1
kind: SPECIALIST
category: discoverability
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Checks crawlability, indexability, canonicals, robots, and sitemaps. Use when public pages you want found. Do not promise that a page will be indexed. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
