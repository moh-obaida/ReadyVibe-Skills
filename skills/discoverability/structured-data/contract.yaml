name: structured-data
version: 0.1.0
contract: 1
kind: SPECIALIST
category: discoverability
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Validates JSON-LD against visible content. Use when structured data already exists or the content is a real article, product, or organization. Do not invent ratings or reviews. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
