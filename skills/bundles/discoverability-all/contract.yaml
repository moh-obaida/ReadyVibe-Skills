name: discoverability-all
version: 0.1.0
contract: 1
kind: BUNDLE
category: bundles
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Selects search, metadata, sharing, and identity checks. Use when you want public pages to be findable and shareable. Do not treat this as a ranking guarantee. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
