name: compliance-all
version: 0.1.0
contract: 1
kind: BUNDLE
category: bundles
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Selects the compliance profile. Use when you want privacy, consent, rights, and policy consistency checked. Do not use this to force a cookie banner onto a site that does not track people."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
