name: admin-authorization
version: 0.1.0
contract: 1
kind: SPECIALIST
category: admin
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Requires server-side capability checks on admin operations. Use whenever an admin path or API exists. Do not hide links and call that authorization. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
