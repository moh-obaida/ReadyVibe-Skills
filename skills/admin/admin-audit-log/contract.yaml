name: admin-audit-log
version: 0.1.0
contract: 1
kind: SPECIALIST
category: admin
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Records who did what on destructive admin actions, without copying secrets. Use when admins change users, roles, or content. Do not log passwords or tokens. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
