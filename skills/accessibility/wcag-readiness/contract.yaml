name: wcag-readiness
version: 0.1.0
contract: 1
kind: SPECIALIST
category: accessibility
visual: NON_VISUAL
engine: ">=0.1.0 <1.0.0"
purpose: "Runs automatable WCAG 2.2 AA checks and lists what still needs a person. Use when you want accessibility issues found or fixed. Do not treat a scanner score as conformance. Do not use it outside that situation."
activation:
  any:
    - capability: HAS_PUBLIC_CONTENT
consumes: [model.routes]
produces: [findings]
controlsOwned: []
mutation:
  mayCreate: []
  mayModify: []
  mustNotModify: []
questions: []
verification:
  personas: [first-visit]
  probes: [recon]
failure:
  onVerificationFail: report-only
  onMissingInputs: report-unknown
legalReviewTriggers: []
bundles: []
